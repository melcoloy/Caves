<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Les Caves du Doudou</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐉</text></svg>" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="game">
    <header class="hud">
      <h1>Les Caves du Doudou</h1>
      <div class="stats">
        <span>Profondeur <strong id="depth">1</strong></span>
        <span>Tours <strong id="turns">0</strong></span>
        <span class="seed">Graine <strong id="seed">—</strong></span>
      </div>
    </header>

    <div class="board">
      <canvas id="screen" aria-label="Carte du donjon"></canvas>
    </div>

    <ul id="log" class="log" aria-live="polite"></ul>

    <footer class="help">
      Flèches / ZQSD : se déplacer · Entrée : descendre · R : nouvelle partie
    </footer>
  </main>

  <script type="module" src="src/main.js"></script>
</body>
</html>
