# Déploie le jeu sur GitHub Pages à chaque push sur main.
# Prérequis (une seule fois) : Settings → Pages → Source : « GitHub Actions ».
name: Déploiement GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Un seul déploiement à la fois ; un nouveau push annule celui en cours.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Configurer Pages
        uses: actions/configure-pages@v5

      - name: Préparer le site (jeu statique, aucune compilation)
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

      - name: Publier
        id: deployment
        uses: actions/deploy-pages@v4